<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Front-end portfolio: animated, 3D landing pages.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--fg:#f2f1f7;--mut:#9a98ab;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 18px/1.5 "Space Grotesk",system-ui,sans-serif;padding:clamp(20px,5vw,72px);max-width:1200px;margin:auto;background-image:radial-gradient(600px circle at 15% 0%,rgba(124,92,255,.22),transparent 60%),radial-gradient(500px circle at 90% 10%,rgba(34,211,238,.16),transparent 60%);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
h1{font-size:clamp(40px,7vw,96px);letter-spacing:-.03em;line-height:1;margin:6vh 0 clamp(28px,4vw,56px)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}
.f{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:300px;padding:clamp(26px,3vw,44px);border-radius:28px;border:1px solid transparent;overflow:hidden;transition:transform .3s,box-shadow .3s}
.f:hover{transform:translateY(-6px)}
.f.a{background:linear-gradient(#0c0b16,#0c0b16) padding-box,linear-gradient(140deg,#22d3ee,#7c5cff,#ff4fa3) border-box;box-shadow:0 30px 90px -40px #7c5cff}
.f.b{background:linear-gradient(#08100f,#08100f) padding-box,linear-gradient(140deg,#34d399,#22d3ee,#7c5cff) border-box;box-shadow:0 30px 90px -40px #22d3ee}
.f span{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
.f h2{font-size:clamp(30px,4vw,52px);letter-spacing:-.02em;line-height:1.05;margin-top:12px}
.f i{font-style:normal;font-size:34px;align-self:flex-end;transition:transform .3s}.f:hover i{transform:translate(6px,-6px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.p{padding:26px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.03);display:flex;justify-content:space-between;align-items:center;transition:background .25s,border-color .25s}
.p:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.3)}
</style></head>
<body>
<h1>Portfolio</h1>
<div class="feat">
  <a class="f a" href="services/"><div><span>Start here</span><h2>My Services &amp; What You Get</h2></div><i>&#8599;</i></a>
  <a class="f b" href="skills/"><div><span>The toolbox</span><h2>My Skills</h2></div><i>&#8599;</i></a>
</div>
<div class="grid">
  <a class="p" href="webinar/">Webinar <i>&#8599;</i></a>
  <a class="p" href="logistics/">Logistics &amp; freight <i>&#8599;</i></a>
  <a class="p" href="furniture/">Custom furniture <i>&#8599;</i></a>
  <a class="p" href="school/">Online school <i>&#8599;</i></a>
  <a class="p" href="oroverde/">B2B wholesale <i>&#8599;</i></a>
  <a class="p" href="saas/">SaaS <i>&#8599;</i></a>
</div>
</body></html>
